name: dbt CI

on:
  pull_request:
    branches: [ main, development ]
  push:
    branches: [ main ]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ../.dbt
      DBT_PROFILE: dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.11.2 dbt-duckdb

      - name: Debug dbt
        run: |
          cd dbt_ci
          pwd
          ls -la
          ls -la ../.dbt
          cat ../.dbt/profiles.yml
          dbt debug

      - name: Extract ticket id
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          echo "Branch: $BRANCH"

          TICKET=$(echo "$BRANCH" | grep -o 'EDM-[0-9]\+' || true)

          if [ -z "$TICKET" ]; then
            echo "No ticket found in branch, skipping ticket-based validation"
          else
            echo "Ticket detected: $TICKET"
          fi

          echo "TICKET=$TICKET" >> $GITHUB_ENV

      - name: Run dbt
        run: |
          cd dbt_ci
          dbt run

      - name: Run show.py
        run: |
          set +e
          python show.py "$TICKET" > show_output.txt 2>&1
          SHOW_EXIT_CODE=$?
          
          echo "===== show.py output ====="
          cat show_output.txt
          echo "=========================="
          
          echo "SHOW_EXIT_CODE=$SHOW_EXIT_CODE" >> $GITHUB_ENV

          {
            echo "SHOW_OUTPUT<<EOF"
            cat show_output.txt
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Update PR with show.py output
        if: env.TICKET != ''
        uses: actions/github-script@v7
        with:
          script: |
            const content = process.env.SHOW_OUTPUT;
            const commentMarker = '<!-- SHOW-PY-COMMENT -->';
      
            const comments = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
      
            const botComments = comments.data.filter(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes(commentMarker)
            );
      
            for (const comment of botComments) {
              const outdatedBody =
                commentMarker + '\n' +
                '> **This comment was marked as outdated.**\n\n' +
                '<details>\n' +
                '<summary>View Previous Analysis</summary>\n\n' +
                comment.body.replace(commentMarker, '').trim() + '\n\n' +
                '</details>';
      
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
                body: outdatedBody
              });
            }
      
            const markedContent =
              commentMarker +
              '\n## Show.py Validation Results\n\n```' +
              '\n' + content + '\n```';
      
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markedContent
            });

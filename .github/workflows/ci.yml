name: dbt CI (no DB)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: .dbt
      DBT_PROFILE: dummy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.11.2 dbt-duckdb

      - name: Debug dbt
        run: |
          pwd
          ls -la
          ls -la .dbt
          cat .dbt/profiles.yml
          dbt debug

      - name: Run dbt
      - run: |
          cd dbt_ci
          dbt debug
          dbt run
name: dbt CI (no DB)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  dbt:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install deps
      run: pip install -r requirements.txt

    - name: dbt compile
      run: |
        cd dbt_ci
        dbt compile --profiles-dir .

    - name: Validate SQL
      run: |
        python show.py marts/sample_model
